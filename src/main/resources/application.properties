# ================================
# MD Store - application.properties
# ================================

server.port=8080

# ================================
# MySQL - recommender_db
# ================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/recommender_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Thymeleaf
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false

# Static files
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**

# Session timeout (1 hour)
server.servlet.session.timeout=1h

# Show errors in development
server.error.include-message=always
server.error.include-stacktrace=never
server.error.include-binding-errors=always

# Fix: disable default BasicErrorController to avoid conflict with GlobalErrorController
spring.autoconfigure.exclude=org.springframework.boot.webmvc.autoconfigure.error.ErrorMvcAutoConfiguration

# File upload limit
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
