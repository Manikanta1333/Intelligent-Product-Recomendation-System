<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Wishlist - MD Store</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
</head>
<body>

<div class="announcement-bar">🚚 Free shipping on orders above ₹5000 &nbsp;|&nbsp; 15-day return policy</div>

<header class="main-header">
    <div class="container">
        <div class="header-inner">
            <a href="/" class="logo"><div class="logo-mark">MD</div><div class="logo-text">MD <span>Store</span></div></a>
            <form class="search-bar" onsubmit="return handleSearch(event)"><input type="text" id="search-input" placeholder="Search products..."><button type="submit" class="search-btn"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg></button></form>
            <div class="header-actions">
                <a href="/wishlist" class="icon-btn"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/></svg><span class="badge wishlist-badge" style="display:none">0</span><span>Wishlist</span></a>
                <a href="/cart" class="icon-btn"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/></svg><span class="badge cart-badge" style="display:none">0</span><span>Cart</span></a>
                <a href="/login" class="icon-btn sign-in-link"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg><span>Sign In</span></a>
            </div>
        </div>
    </div>
</header>

<nav class="category-nav">
    <div class="container">
        <ul class="nav-list">
            <li class="nav-item"><a href="/">Home</a></li>
            <li class="nav-item"><a href="/products">All Products</a></li>
            <li class="nav-item"><a href="/products?category=electronics">Electronics</a></li>
            <li class="nav-item"><a href="/products?category=fashion">Fashion</a></li>
            <li class="nav-item"><a href="/products?category=beauty">Beauty</a></li>
        </ul>
    </div>
</nav>

<div class="container" style="padding-top:30px;padding-bottom:60px;">
    <nav class="breadcrumbs"><a href="/">Home</a><span>/</span><span>My Wishlist</span></nav>

    <div style="display:flex;align-items:center;justify-content:space-between;margin:16px 0 28px;flex-wrap:wrap;gap:12px;">
        <h1 style="font-family:var(--font-display);font-size:1.8rem;font-weight:700;">
            My Wishlist <span style="color:var(--yellow);font-size:1.2rem;" id="wishlist-count-label">(0 items)</span>
        </h1>
        <button class="btn btn-outline btn-sm" onclick="addAllToCart()">🛒 Add All to Cart</button>
    </div>

    <div class="wishlist-grid" id="wishlist-container">
        <div class="loading-overlay"><div class="spinner"></div></div>
    </div>
</div>

<footer class="footer">
    <div class="container">
        <div class="footer-bottom"><p>&copy; 2026 MD Store. All rights reserved.</p></div>
    </div>
</footer>

<script th:inline="javascript">
    window.isLoggedIn = /*[[${loggedIn}]]*/ false;
    window.currentUserId = /*[[${userId}]]*/ null;
</script>
<script th:src="@{/js/api.js}" src="/js/api.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    renderWishlist();
});

function renderWishlist() {
    var list = MDStore.Wishlist.get();
    var container = document.getElementById('wishlist-container');
    var countEl = document.getElementById('wishlist-count-label');
    if (countEl) countEl.textContent = '(' + list.length + ' item' + (list.length !== 1 ? 's' : '') + ')';

    if (!list || list.length === 0) {
        container.innerHTML = '<div class="empty-state" style="grid-column:1/-1"><div class="empty-icon">♡</div><h3>Your Wishlist is Empty</h3><p>Save products you love and shop them later.</p><a href="/products" class="btn btn-primary">Explore Products</a></div>';
        return;
    }

    var ICONS = ['🎧', '⌚', '👗', '🍼', '⚽', '💄', '🏃', '🎮'];
    container.innerHTML = list.map(function(item, idx) {
        return '<div class="product-card" id="wl-item-' + item.id + '">' +
            '<div class="product-img-wrap">' +
            (item.image ? '<img src="' + item.image + '" alt="' + item.name + '">' : '<div class="product-img-placeholder">' + ICONS[idx % ICONS.length] + '</div>') +
            '<button class="wishlist-btn active" onclick="removeFromWishlist(' + item.id + ')" title="Remove from wishlist">♥</button>' +
            '</div>' +
            '<div class="product-info">' +
            '<div class="product-brand">' + (item.brand || 'Brand') + '</div>' +
            '<div class="product-name">' + item.name + '</div>' +
            '<div class="product-price-row"><span class="product-price">' + MDStore.Format.price(item.price) + '</span></div>' +
            '<div class="product-actions">' +
            '<button class="btn btn-primary btn-sm" onclick="addToCartFromWishlist(' + item.id + ')">🛒 Add to Cart</button>' +
            '<a href="/product-detail?id=' + item.id + '" class="btn btn-outline btn-sm">View</a>' +
            '</div></div></div>';
    }).join('');
}

function removeFromWishlist(id) {
    MDStore.Wishlist.remove(id);
    var el = document.getElementById('wl-item-' + id);
    if (el) {
        el.style.opacity = '0';
        el.style.transform = 'scale(0.8)';
        el.style.transition = 'all 0.3s ease';
        setTimeout(function() { el.remove(); renderWishlist(); }, 300);
    }
    MDStore.Toast.show('Removed from wishlist');
}

function addToCartFromWishlist(id) {
    var item = MDStore.Wishlist.get().find(function(i) { return i.id === id; });
    if (item) MDStore.Cart.add(item, 1);
}

function addAllToCart() {
    var list = MDStore.Wishlist.get();
    if (list.length === 0) { MDStore.Toast.show('Your wishlist is empty'); return; }
    list.forEach(function(item) { MDStore.Cart.add(item, 1); });
    MDStore.Toast.show('All ' + list.length + ' items added to cart!', 'success');
}

function handleSearch(e) {
    e.preventDefault();
    var q = document.getElementById('search-input').value.trim();
    if (q) window.location.href = '/products?q=' + encodeURIComponent(q);
    return false;
}
</script>
</body>
</html>
