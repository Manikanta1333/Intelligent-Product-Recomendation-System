<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - MD Store</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
</head>
<body>

<header class="main-header">
    <div class="container">
        <div class="header-inner">
            <a href="/" class="logo"><div class="logo-mark">MD</div><div class="logo-text">MD <span>Store</span></div></a>
            <div></div>
            <div class="header-actions">
                <a href="/cart" class="icon-btn"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/></svg><span class="badge cart-badge" style="display:none">0</span><span>Cart</span></a>
            </div>
        </div>
    </div>
</header>

<div class="container">
    <div class="page-404">
        <div style="text-align:center;">
            <div class="page-404-num">404</div>
            <h2>Page Not Found</h2>
            <p>The page you're looking for doesn't exist or has been moved.</p>
            <div style="display:flex;gap:14px;justify-content:center;flex-wrap:wrap;">
                <a href="/" class="btn btn-primary btn-lg">🏠 Go Home</a>
                <a href="/products" class="btn btn-outline btn-lg">🛍 Browse Products</a>
            </div>
            <div style="margin-top:48px;">
                <p style="color:var(--gray-500);font-size:0.875rem;margin-bottom:20px;">Popular Categories</p>
                <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">
                    <a href="/products?category=electronics" class="btn btn-outline btn-sm">📱 Electronics</a>
                    <a href="/products?category=fashion" class="btn btn-outline btn-sm">👗 Fashion</a>
                    <a href="/products?category=sports" class="btn btn-outline btn-sm">⚽ Sports</a>
                    <a href="/products?category=beauty" class="btn btn-outline btn-sm">💄 Beauty</a>
                </div>
            </div>
        </div>
    </div>
</div>

<footer class="footer">
    <div class="container">
        <div class="footer-bottom"><p>&copy; 2026 MD Store. All rights reserved.</p></div>
    </div>
</footer>

<script th:src="@{/js/api.js}" src="/js/api.js"></script>
</body>
</html>
