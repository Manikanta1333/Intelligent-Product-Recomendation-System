<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - MD Store</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="auth-page">
    <div class="auth-container">

        <div class="auth-logo">
            <a href="/" class="logo" style="justify-content:center;">
                <div class="logo-mark" style="width:52px;height:52px;font-size:1.6rem;">MD</div>
                <div class="logo-text" style="font-size:1.8rem;">MD <span>Store</span></div>
            </a>
        </div>

        <div class="auth-card">
            <h1 class="auth-title">Welcome Back</h1>
            <p class="auth-subtitle">Sign in to your MD Store account</p>

            <!-- ✅ Flash error from server -->
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
            <!-- ✅ Flash success from server -->
            <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

            <!-- ✅ POST to /login — server handles authentication -->
            <form action="/login" method="post" id="login-form" onsubmit="return validateLogin()">

                <div class="form-group">
                    <label class="form-label" for="email">Email Address</label>
                    <input type="email" id="email" name="email" class="form-control"
                           placeholder="you@example.com" required autocomplete="email">
                    <div class="form-error" id="email-error">Please enter a valid email</div>
                </div>

                <div class="form-group">
                    <label class="form-label" style="display:flex;justify-content:space-between;">
                        <span>Password</span>
                        <a href="#" style="font-size:0.8rem;color:var(--yellow);">Forgot Password?</a>
                    </label>
                    <div style="position:relative;">
                        <input type="password" id="password" name="password" class="form-control"
                               placeholder="Enter your password" required
                               style="padding-right:50px;" autocomplete="current-password">
                        <button type="button" id="toggle-pwd"
                                onclick="togglePassword()"
                                style="position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:1.1rem;">👁</button>
                    </div>
                    <div class="form-error" id="pass-error">Password is required</div>
                </div>

                <div class="checkbox-row">
                    <input type="checkbox" id="remember-me">
                    <label for="remember-me">Remember me for 30 days</label>
                </div>

                <button type="submit" class="btn btn-primary btn-lg btn-block"
                        style="justify-content:center;" id="login-btn">
                    Sign In
                </button>
            </form>

            <div class="auth-divider">or</div>

            <div style="text-align:center;font-size:0.875rem;color:var(--gray-500);">
                Sign In : use any registered email & password
            </div>
        </div>

        <div class="auth-footer">
            Don't have an account? <a href="/register">Create one — it's free!</a>
        </div>
        <div class="auth-footer" style="margin-top:8px;">
            <a href="/" style="color:var(--gray-500);">← Back to Home</a>
        </div>
    </div>
</div>

<script th:src="@{/js/api.js}"></script>
<script>
function togglePassword() {
    var input = document.getElementById('password');
    var btn   = document.getElementById('toggle-pwd');
    input.type = input.type === 'password' ? 'text' : 'password';
    btn.textContent = input.type === 'password' ? '👁' : '🙈';
}

function validateLogin() {
    var email = document.getElementById('email').value.trim();
    var pass  = document.getElementById('password').value;
    var valid = true;

    if (!email.match(/^[^\s@]+@[^\s@]+\.[^\s@]+$/)) {
        document.getElementById('email').classList.add('is-invalid');
        valid = false;
    } else {
        document.getElementById('email').classList.remove('is-invalid');
    }

    if (pass.length < 1) {
        document.getElementById('password').classList.add('is-invalid');
        valid = false;
    } else {
        document.getElementById('password').classList.remove('is-invalid');
    }

    if (valid) {
        var btn = document.getElementById('login-btn');
        btn.innerHTML = '<span class="spinner"></span> Signing in...';
        btn.disabled = true;
    }
    return valid;
}
</script>
</body>
</html>
